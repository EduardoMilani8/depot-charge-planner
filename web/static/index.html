<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório de recarga</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1>Laboratório de recarga</h1>
  <p class="sub">Simulador de garagem de ônibus elétricos com dados sintéticos: mostra como o algoritmo se comporta, não o resultado numa garagem real.</p>
</header>
<nav class="tabs" id="tablist" role="tablist" aria-label="Seções">
  <button role="tab" id="t-scenario" aria-controls="tab-scenario" data-tab="scenario" aria-selected="true">Cenário</button>
  <button role="tab" id="t-compare" aria-controls="tab-compare" data-tab="compare" aria-selected="false">Comparação</button>
  <button role="tab" id="t-run" aria-controls="tab-run" data-tab="run" aria-selected="false">Execução</button>
</nav>
<div id="banner" class="banner" role="alert" hidden></div>
<main>
  <section id="tab-scenario" role="tabpanel" aria-labelledby="t-scenario"></section>
  <section id="tab-compare" role="tabpanel" aria-labelledby="t-compare" hidden><div id="compare-out"><p class="note">Rode um cenário para ver a comparação.</p></div></section>
  <section id="tab-run" role="tabpanel" aria-labelledby="t-run" hidden><div id="run-out"><p class="note">A execução detalhada chega na próxima etapa; por enquanto, use a Comparação.</p></div></section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
